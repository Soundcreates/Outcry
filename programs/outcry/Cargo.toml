[package]
name = "outcry"
version = "0.1.0"
description = "OUTCRY onchain match foundation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "outcry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
localnet = []

[dependencies]
anchor-lang = "1.0.2"
ephemeral-rollups-sdk = { version = "0.17.0", features = ["anchor", "access-control"] }
pyth-solana-receiver-sdk = "2.0.0"
